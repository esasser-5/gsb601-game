<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — GSB 601</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

  <div id="admin-title">GSB 601 · Presenter Controls</div>

  <div id="admin-player-count">—</div>
  <div id="admin-player-label">Players Connected</div>

  <div id="admin-countdown"></div>

  <div id="timer-controls">
    <button id="timer-btn">Start 60s Timer</button>
    <button id="timer-pause-btn" style="display:none">Pause</button>
    <button id="timer-reset-btn" style="display:none">Reset Timer</button>
  </div>
  <button id="reveal-btn">Reveal Answers</button>
  <button id="correct-btn" style="display:none">Show Correct Answers</button>
  <button id="reset-btn">Reset Game</button>

  <div id="admin-status">Connected</div>

  <script src="admin.js"></script>
</body>
</html>
