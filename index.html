<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match the Ad — GSB 601</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="header">
    <h1>Match the Ad</h1>
    <div id="player-count">Connecting…</div>
  </div>

  <canvas id="line-canvas"></canvas>

  <div id="game">
    <div id="col-cans"  class="column"></div>
    <div id="col-clues" class="column"></div>
  </div>

  <button id="reveal-btn-game">Reveal Answers</button>

  <div id="reveal-overlay">
    <div id="reveal-box">
      <h2>Answers Revealed</h2>
      <div id="score-text"></div>
      <p>Tap anywhere to close</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
